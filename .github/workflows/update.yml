name: Refresh README

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - config.json
      - generate.mjs
      - 'lib/**'
      - 'fonts/**'
      - package.json
      - package-lock.json
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate.mjs

      - name: Self-test
        run: node generate.mjs --check

      - name: Commit if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets data worker/src/generated.mjs
          if git diff --cached --quiet; then
            echo "Nothing changed."
            # Keepalive: GitHub switches scheduled workflows off after 60 days
            # without repository activity. An empty commit after 45 quiet days
            # keeps this one running.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "chore: keepalive [skip ci]"
              git push
            fi
          else
            git commit -m "chore: refresh readme [skip ci]"
            git push
          fi
